<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    /* Set the pink fairy cursor globally for all elements */
    HTML, BODY {
      cursor: url("https://downloads.totallyfreecursors.com/cursor_files/fairypink3.ani"), 
             url("https://downloads.totallyfreecursors.com/thumbnails/fairypink3.gif"), auto;
    }

    /* Ensure buttons and other interactive elements also have the custom cursor when hovered */
    button, a {
      cursor: url("https://downloads.totallyfreecursors.com/cursor_files/fairypink3.ani"), 
             url("https://downloads.totallyfreecursors.com/thumbnails/fairypink3.gif"), auto;
    }
  </style>
</head>
<body>
  <div class="gallery-container">
    <div class="gallery-header">
      <button class="home-button" (click)="goHome()">Home</button>
      
      <!-- Upload Section -->
      <div class="upload-section">
        <label for="file-upload" class="upload-button">
          <span *ngIf="!uploading">+ Add Image</span>
          <span *ngIf="uploading">Uploading...</span>
        </label>
        <input 
          id="file-upload" 
          type="file" 
          accept="image/*" 
          (change)="onFileSelected($event)"
          [disabled]="uploading"
          style="display: none;"
        >
      </div>
    </div>
    
    <!-- Gallery Grid -->
    <div class="gallery-grid">
      <div 
        *ngFor="let image of images; let i = index" 
        class="gallery-item"
      >
        <img [src]="image.url" [alt]="'Gallery Image ' + (i + 1)" (click)="openLightbox(i)">
        <button class="delete-button" (click)="deleteImage(image.id, image.path)" title="Delete image">
          &times;
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="images.length === 0 && !uploading" class="empty-state">
      <p>No images yet. Click "Add Image" to upload your first image!</p>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-overlay" *ngIf="lightboxOpen" (click)="closeLightbox()">
      <div class="lightbox-content" (click)="$event.stopPropagation()">
        <button class="lightbox-close" (click)="closeLightbox()">&times;</button>
        <button class="lightbox-arrow lightbox-prev" (click)="prevLightboxImage()">&#10094;</button>
        <img [src]="getImageUrl(currentLightboxImage)" [alt]="'Gallery Image ' + (currentLightboxImage + 1)">
        <button class="lightbox-arrow lightbox-next" (click)="nextLightboxImage()">&#10095;</button>
        <div class="lightbox-counter">{{ currentLightboxImage + 1 }} / {{ images.length }}</div>
      </div>
    </div>
  </div>

</body>
</html>
