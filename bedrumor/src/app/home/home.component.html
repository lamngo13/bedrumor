<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrumor</title>
  <style>
    /* Set the pink guitar cursor globally for all elements */
    HTML, BODY {
      cursor: url("https://downloads.totallyfreecursors.com/cursor_files/guitarpink.ani"), 
             url("https://downloads.totallyfreecursors.com/thumbnails/guitarpink.gif"), auto;
    }

    /* If you want the cursor to follow mouse events, you can have this style: */
    .cursor-follow-gif {
      position: absolute;
      pointer-events: none;
      width: 3.5vw;
      height: 3.5vw;
    }

    /* Ensure buttons and links also have the custom cursor when hovered */
    button, a {
      cursor: url("https://downloads.totallyfreecursors.com/cursor_files/guitarpink.ani"), 
             url("https://downloads.totallyfreecursors.com/thumbnails/guitarpink.gif"), auto;
    }
  </style>

  <style>
    /* Needed for mobile overlay */
    .video-wrapper {
      position: relative;
    }

    .mobile-youtube-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      display: block;
      z-index: 999;
    }
  </style>
</head>

<body (mousemove)="onMouseMove($event)">
  <img 
    [src]="imageSrc" 
    [ngStyle]="{ top: gifPosition.y + 'px', left: gifPosition.x + 'px' }" 
    class="cursor-follow-gif" 
  />

  <div class="page-container">
    <!-- Header -->
    <header class="sticky-header" [class.scrolled]="isScrolled">
      <button class="menu-button rainbow_text_animated_menu" (click)="shop()">merch</button>
      <button class="menu-button rainbow_text_animated_menu" (click)="second()">gallery</button>
      <button class="menu-button rainbow_text_animated_menu" (click)="game()">game</button>
      <button class="menu-button rainbow_text_animated_menu" (click)="guestbook_function()">guestbook</button>
    </header>

    <div class="title-video-container">
      <div class="title-section">
        <img src="assets/img/teal-butterfly.gif" class="teal-btrfly" alt="Logo" />
      </div>
      
      <div class="video-container">
        <div class="mother-hands-title">Latest Video</div>

        <!-- 👇 Wrapper added for overlay -->
        <div class="video-wrapper">
          <iframe
            [src]="videoUrl"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>

          <!-- 👇 Mobile overlay that opens YouTube app -->
          <a 
            *ngIf="isMobile"
            class="mobile-youtube-overlay"
            [href]="youtubeAppUrl">
          </a>
        </div>
      </div>
    </div>
  
    <div class="divider-butterfly">
      <img src="assets/img/butterfly-div.gif" class="butterfly-div" alt="Logo" />
    </div>

    <!-- Socials -->
    <div class="socials-container">
      <h1 class="rainbow_text_animated">check out our socials</h1>
      <div class="socials-links">
        <a href="https://www.instagram.com/bedrumor/" target="_blank">instagram</a>
        <a href="https://open.spotify.com/artist/7xQaQxlrXaBtgGcq4rsrHI?si=80NQobWpQXOEyWKPkfhArw" target="_blank">spotify</a>
        <a href="https://music.apple.com/us/artist/bedrumor/1779628604" target="_blank">apple music</a>
      </div>
    </div>

    <!-- Events -->
  </div> <!-- Closing .page-container -->

</body>
</html>
