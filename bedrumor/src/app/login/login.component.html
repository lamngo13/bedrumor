<style>
  /* Set the pink fairy cursor globally for all elements */
  HTML, BODY {
    cursor: url("https://downloads.totallyfreecursors.com/cursor_files/fairypink3.ani"), 
           url("https://downloads.totallyfreecursors.com/thumbnails/fairypink3.gif"), auto;
  }

  /* Ensure buttons and other interactive elements also have the custom cursor when hovered */
  button, a {
    cursor: url("https://downloads.totallyfreecursors.com/cursor_files/fairypink3.ani"), 
           url("https://downloads.totallyfreecursors.com/thumbnails/fairypink3.gif"), auto;
  }
</style>

<div class="gallery-container">
  <div class="gallery-header">
    <button class="home-button" (click)="goHome()">Home</button>
  </div>

  <div class="gallery-header">
    <button class="home-button" (click)="openPasswordDialog()">Login</button>
  </div>

  <div class="gallery-header">
    <button *ngIf="isLoggedIn" class="home-button" (click)="genupload()">UPLOAD IMAGE</button>
  </div>
  
  <!-- Gallery Grid -->
  <div class="gallery-grid">
    <div 
      *ngFor="let image of images; let i = index" 
      class="gallery-item"
      (click)="openLightbox(i)"
    >
      <img [src]="image" [alt]="'Gallery Image ' + (i + 1)">
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-overlay" *ngIf="lightboxOpen" (click)="closeLightbox()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <button class="lightbox-close" (click)="closeLightbox()">&times;</button>
      <button class="lightbox-arrow lightbox-prev" (click)="prevLightboxImage()">&#10094;</button>
      
      <img 
        [src]="images[currentLightboxImage]" 
        [alt]="'Gallery Image ' + (currentLightboxImage + 1)"
      >
      
      <button class="lightbox-arrow lightbox-next" (click)="nextLightboxImage()">&#10095;</button>

      <div class="lightbox-counter">
        {{ currentLightboxImage + 1 }} / {{ images.length }}
      </div>
    </div>
  </div>
</div>
